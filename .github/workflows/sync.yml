name: 同步 GitHub 仓库数据

on:
  schedule:
    # 每天 00:10 UTC（北京时间 08:10）运行一次；GitHub 定时任务可能有几分钟到半小时的延迟
    - cron: '10 0 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: write # 提交数据文件所需
  pages: write # 数据变化后重新部署网站所需
  id-token: write # Pages 部署身份验证所需

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 运行同步脚本
        env:
          # 使用 Actions 内置令牌，仅存在于运行环境，不进入前端与公开数据
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github.mjs

      - name: 仅在有变化时提交数据
        id: commit
        run: |
          if [ -n "$(git status --porcelain public/data/repos.json public/data/meta.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/repos.json public/data/meta.json
            git commit -m "chore(data): 同步 GitHub 仓库指标"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "数据无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装依赖
        if: steps.commit.outputs.changed == 'true'
        run: npm ci

      - name: 生产构建
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: 上传构建产物
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 数据确实变化时才部署；失败的仓库已由脚本保留旧数据，部署内容不受影响。
  # 本工作流没有 push 触发器，且提交使用 GITHUB_TOKEN，不会再次触发自身或其他工作流，无循环风险。
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
